name: CI

# Runs on every push to a protected branch and every PR into one.
#
# The jobs below are deliberately the SAME commands as `make check` and
# `make security`. If CI and local ever diverge, one of them is lying, and the
# one you trust is whichever you did not just run.

on:
  push:
    branches: [DEV, QA, PROD, main]
  pull_request:
    branches: [DEV, QA, PROD, main]
  workflow_dispatch:

# A newer push to the same branch cancels the older run. Never cancel on the
# protected branches themselves — a promotion decision reads those results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 3.11 is the project floor AND what ops/Dockerfile ships. Testing the version
  # the artifact actually runs is the point — an image built on a version the
  # suite never exercised is not the thing that was verified. Bumping the image
  # means bumping this first.
  PYTHON_VERSION: "3.11"

defaults:
  run:
    working-directory: Code

jobs:
  # ---------------------------------------------------------------------
  # Fast feedback. Fails in ~1 minute on a formatting or typing error rather
  # than after the full container-backed suite.
  # ---------------------------------------------------------------------
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Code/pyproject.toml

      - name: Install
        run: |
          # setuptools AND wheel, not just pip. actions/setup-python ships
          # setuptools in the 65-68 range, which carries eight advisories,
          # and `--upgrade pip` alone leaves it there. That is what made the
          # dependency audit fail while the project's own pinned set was
          # clean — the finding was in the BUILD environment, not in
          # anything constraints.txt describes.
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints.txt -e ".[dev]"
          # B7 / CVE-2020-35678. kiteconnect hard-pins autobahn==19.11.2, so a
          # floor in our own dependencies is unsatisfiable — resolution has to
          # succeed first, then the package is replaced. --no-deps because the
          # graph is already solved and we are only swapping one node.
          pip install --no-deps --upgrade "autobahn==26.7.1"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src

  # ---------------------------------------------------------------------
  # The full suite, including the container-backed integration tests.
  #
  # No `services:` block: the tests use testcontainers, which starts its own
  # TimescaleDB and Redis from the pins in ops/docker-compose.yml. Declaring
  # them here as well would mean CI tests a DIFFERENT version from the one
  # production runs, which is the whole failure that reading the pin out of
  # compose was designed to prevent. Docker is present on ubuntu runners.
  # ---------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Code/pyproject.toml

      - name: Install
        run: |
          # setuptools AND wheel, not just pip. actions/setup-python ships
          # setuptools in the 65-68 range, which carries eight advisories,
          # and `--upgrade pip` alone leaves it there. That is what made the
          # dependency audit fail while the project's own pinned set was
          # clean — the finding was in the BUILD environment, not in
          # anything constraints.txt describes.
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints.txt -e ".[dev]"
          # B7 / CVE-2020-35678. kiteconnect hard-pins autobahn==19.11.2, so a
          # floor in our own dependencies is unsatisfiable — resolution has to
          # succeed first, then the package is replaced. --no-deps because the
          # graph is already solved and we are only swapping one node.
          pip install --no-deps --upgrade "autobahn==26.7.1"

      - name: Pre-pull datastore images
        # Pulled explicitly so a slow registry shows up as a pull step rather
        # than as a mysterious testcontainers timeout inside a test.
        run: |
          docker pull "$(python -c "import yaml;print(yaml.safe_load(open('ops/docker-compose.yml'))['services']['timescaledb']['image'])")"
          docker pull "$(python -c "import yaml;print(yaml.safe_load(open('ops/docker-compose.yml'))['services']['redis']['image'])")"

      - name: pytest
        run: pytest -q --junitxml=test-results.xml

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Code/test-results.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Security gate. Separate from `test` so a dependency CVE is visibly a
  # security failure rather than an anonymous red X.
  # ---------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Code/pyproject.toml

      - name: Install
        run: |
          # setuptools AND wheel, not just pip. actions/setup-python ships
          # setuptools in the 65-68 range, which carries eight advisories,
          # and `--upgrade pip` alone leaves it there. That is what made the
          # dependency audit fail while the project's own pinned set was
          # clean — the finding was in the BUILD environment, not in
          # anything constraints.txt describes.
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints.txt -e ".[dev]"
          # B7 / CVE-2020-35678. kiteconnect hard-pins autobahn==19.11.2, so a
          # floor in our own dependencies is unsatisfiable — resolution has to
          # succeed first, then the package is replaced. --no-deps because the
          # graph is already solved and we are only swapping one node.
          pip install --no-deps --upgrade "autobahn==26.7.1"

      - name: Safety invariants and pen-test suite
        run: pytest tests/security/ -q

      - name: Dependency audit
        # HARD GATE as of 24 Aug 2026. This was advisory while B7 was open —
        # kiteconnect pins autobahn 19.11.2 (CVE-2020-35678) and a permanently
        # red check trains people to ignore it. B7 is now closed: the pin is
        # declarative and kiteconnect works under autobahn 26.7.1, which the
        # Install step above applies AFTER resolution. A floor in pyproject
        # cannot work — `==19.11.2` makes it unsatisfiable and pip fails.
        #
        # With the known finding gone, "advisory" only means the next CVE
        # arrives silently. The audit is clean, so it can and must block.
        # --skip-editable, NOT --strict. `--strict` treats a SKIPPED dependency
        # as an error, and the local editable `algotrader` package is always
        # skipped because it is not on PyPI — so --strict fails every run for a
        # reason that has nothing to do with vulnerabilities. Without it,
        # pip-audit still exits non-zero when it actually finds one, which is
        # the behaviour this gate wants.
        run: |
          set -uo pipefail
          # Human-readable to the LOG first. Writing only JSON to a file made
          # this gate fail with an empty console, which meant a red build said
          # nothing about what was wrong — the findings were in an artifact
          # that needs credentials to download. A gate that cannot explain
          # itself gets disabled rather than fixed.
          pip-audit --desc --skip-editable | tee pip-audit.txt
          status=${PIPESTATUS[0]}
          pip-audit --skip-editable --format=json --output=pip-audit.json || true
          echo "--- versions of interest ---"
          python -c "import importlib.metadata as m;[print(' ',n,m.version(n)) for n in ('autobahn','kiteconnect','setuptools','bandit','pip')]"
          exit "$status"

      - name: Static application security testing
        # Fails on MEDIUM and above only. Every LOW in this codebase is an
        # assert used for type narrowing behind an explicit guard, and nothing
        # runs under python -O; gating on LOW would be noise that gets muted.
        run: bandit -r src/ -q --severity-level medium --confidence-level medium

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: Code/pip-audit.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Proves the deployable artifact still builds, and that it contains ONLY
  # what should be shipped. Build only — nothing is pushed to a registry.
  # ---------------------------------------------------------------------
  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: Code
          file: Code/ops/Dockerfile
          push: false
          load: true
          tags: algotrader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the image ships only what it needs
        # "Only move what is necessary" is enforced HERE, on the artifact —
        # not by promoting a partial source tree between branches. Tests,
        # design documents and the planning tracker must never reach a
        # runtime image: they are dead weight and widen the attack surface
        # for no operational benefit.
        run: |
          set -euo pipefail
          echo "--- /app contents ---"
          docker run --rm --entrypoint sh algotrader:ci -c 'ls -la /app'
          for forbidden in /app/tests /app/Documents /app/migrations /app/.git /app/.venv; do
            if docker run --rm --entrypoint sh algotrader:ci -c "test -e $forbidden"; then
              echo "::error::$forbidden is present in the runtime image"
              exit 1
            fi
          done
          if docker run --rm --entrypoint sh algotrader:ci -c 'test -e /app/.env'; then
            echo "::error::a .env file reached the runtime image"
            exit 1
          fi
          docker run --rm algotrader:ci python -c "import algotrader; print('import ok')"
          echo "image contains only src/ and config/, and imports cleanly"

  # ---------------------------------------------------------------------
  # A single check for branch protection to require.
  # ---------------------------------------------------------------------
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [quality, test, security, image]
    if: always()
    # This job deliberately checks nothing out — it only reads the results of
    # the jobs above. So the workflow-level `working-directory: Code` default
    # MUST be overridden: with no checkout there is no Code directory, and the
    # runner fails before the script runs at all, with
    # "An error occurred trying to start process '/usr/bin/bash' with working
    # directory .../Code. No such file or directory" — an error that says
    # nothing about the actual cause.
    defaults:
      run:
        working-directory: .
    steps:
      # The condition is evaluated by Actions and gates the STEP, rather than
      # being interpolated into a shell string and compared with `[ ... ]`.
      # That was the original form and it is needlessly fragile: any expression
      # rendering to something unexpected becomes a bash syntax error rather
      # than a clear pass or fail.
      - name: Fail if any upstream job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::one or more CI jobs failed — this commit is not promotable"
          exit 1

      - name: All green
        run: echo "all CI jobs green — this commit is promotable"
