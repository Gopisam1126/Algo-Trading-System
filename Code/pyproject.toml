[project]
name = "algotrader"
version = "0.1.0"
description = "AI-driven algorithmic trading platform for Indian markets (NSE/BSE) — personal use"
# 3.11 is the floor (verified working); 3.12+ recommended for performance.
requires-python = ">=3.11"
readme = "README.md"

# What the deployed code RUNS ON - and nothing else (audit ENG-039, 18 Nov
# 2026). Every entry is imported by src, or is one of the two it needs without
# importing: psycopg (SQLAlchemy loads it from the postgresql+psycopg:// URL)
# and tzdata (zoneinfo's data on a slim image or on Windows).
# tests/security/test_runtime_dependencies.py holds that both ways.
#
# Thirteen packages were declared here for services that do not exist yet -
# the AI layer, the dashboard, a scheduler - so every image shipped, and every
# audit had to triage, web frameworks that never ran. They are extras now,
# named after the service that will import them (`pip install .[api]`), and
# move back the day that service's code does. Removed outright, with nothing
# planned to import them: pydantic-settings, python-dateutil (still arrives
# through kiteconnect), tenacity, uvloop.
dependencies = [
    # --- Core ---
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tzdata>=2024.1",

    # --- Data fabric ---
    "redis[hiredis]>=5.1",
    # Used DIRECTLY by ingest/kite_ws.py, not just transitively via uvicorn.
    # Declared because depending on a transitive dependency is how a build
    # breaks when the intermediate package drops it — and this one carries the
    # market data feed.
    "websockets>=13.0",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",

    # --- Market analysis ---
    # Parquet archive (E01-S06). Large (~100 MB) but it is the standard
    # implementation, preserves types across a round trip, and the archive
    # job runs in the same deployment as everything else. It needs no numpy:
    # CI's image job round-trips a file in the image, where numpy is absent.
    "pyarrow>=18.0",

    # --- Broker ---
    # 5.2.1 is a FLOOR, not a preference. 5.1.0 omitted `market_protection`
    # from place_order() (zerodha/pykiteconnect#225) and MARKET/SL-M orders are
    # rejected without it from 1 Apr 2026 — an SDK below this line cannot square
    # off a position. 5.2.1 also adds the `algo_id` parameter, which is how the
    # SEBI-required Algo-ID is attached (client-supplied per order).
    # `make doctor` re-verifies both against the installed signature.
    "kiteconnect>=5.2.1",      # Zerodha Kite Connect (primary)
    # kiteconnect hard-pins autobahn[twisted]==19.11.2, which carries
    # CVE-2020-35678 (redirect header injection). That pin is DECLARATIVE, not
    # a runtime requirement: the only kiteconnect module importing autobahn is
    # `ticker`, we never construct a KiteTicker, and the whole live feed runs
    # on `websockets` against the documented binary protocol instead.
    #
    # It cannot simply be ignored, though. `kiteconnect/__init__.py` imports
    # `.ticker` unconditionally, so autobahn AND twisted are loaded into every
    # process that touches the broker layer — "we do not use it" is not the
    # same as "it is not there", and pip-audit is right to flag a vulnerable
    # package that is present and importable.
    #
    # Verified empirically: kiteconnect 5.2.1 imports, constructs, builds a
    # login URL and exposes market_protection/algo_id under autobahn 26.10.2,
    # and the full test suite passes.
    #
    # It is NOT declared as a dependency here. `==19.11.2` is a hard pin, so any
    # floor of ours is unsatisfiable and pip fails with ResolutionImpossible —
    # which is exactly what broke CI when it was first attempted. The
    # replacement happens as an explicit post-install step:
    #
    #     pip install --no-deps --upgrade "autobahn==26.10.2"
    #
    # applied in ci.yml, ops/Dockerfile and the Makefile. Forgetting it in a
    # new install site is caught by
    # tests/security/test_dependency_hygiene.py, which fails on a vulnerable
    # autobahn — the enforcement is the test, not the documentation.

    # --- Ops ---
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# One extra per PLANNED service, installed with it and moved into
# `dependencies` the day its code imports them (ENG-039). constraints.txt keeps
# their pins, so `pip install -c constraints.txt .[api]` is still reproducible.
ai = ["anthropic>=0.40"]                    # E10: the Claude client
api = [                                     # E19: the dashboard and its auth
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "webauthn>=2.2",
]
scheduler = ["apscheduler>=3.10"]           # the orchestrator's daily jobs
notify = ["httpx>=0.27"]                    # the notifier's Telegram calls
# Migrations run from the HOST (`make migrate`), never from the image, which
# carries no migrations/ directory.
migrate = ["alembic>=1.13"]
dev = [
    # The migration tests apply the real migrations.
    "alembic>=1.13",
    # The indicator tests' REFERENCE implementation (tests/unit/test_indicators.py):
    # TA-Lib is what each incremental indicator is verified against, and numpy
    # is its input. Production computes every indicator itself.
    "numpy>=2.1",
    "TA-Lib>=0.4.32",
    "bandit>=1.9",            # SAST, gated at MEDIUM in CI
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "testcontainers[postgres,redis]>=4.8",
    # Linters and type checkers are PINNED EXACTLY, not floored.
    #
    # These tools change their output between releases: a new ruff adds rules,
    # a new mypy narrows types differently. With `ruff>=0.7` a developer and CI
    # installed different versions and disagreed about whether the code was
    # clean — CI failed on two I001 findings that the local 0.16.1 did not
    # report at all. The CI workflow claims "if CI and local disagree, one of
    # them is lying"; an unpinned linter builds that lie in by construction.
    #
    # Bump these deliberately, as their own change, so the diff shows which
    # findings are new rules rather than new defects.
    "ruff==0.16.2",
    "mypy==2.3.0",
    "pip-audit>=2.7",
    "types-pyyaml",
]
research = [
    "pandas>=2.2",
    "pandas-ta>=0.3.14b",      # BACKTEST/RESEARCH ONLY — never in the live hot path
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algotrader"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "S",         # bandit (security)
    "C4",        # comprehensions
    "DTZ",       # naive-datetime detection — important: all timestamps must be tz-aware
    "RUF",
]
ignore = [
    "S101",      # assert is fine in tests
]

# RUF001/002/003 flag "confusable" Unicode. The characters below are used
# deliberately in prose throughout the design documents and docstrings — an
# en dash between ranges, ≤/≥ in constraint descriptions, ₹ for rupee amounts.
# They are typography, not homoglyph attacks, and mangling them to ASCII would
# make the documentation worse. Anything NOT on this list is still flagged,
# which is the point: a Cyrillic 'а' in an identifier still gets caught.
allowed-confusables = ["–", "—", "×", "≤", "≥", "→", "₹", "’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
# Alembic generates these and owns their shape; the revision identifiers are
# module-level constants that do not follow normal naming rules.
"migrations/versions/*" = ["N999", "E501"]

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["talib.*", "pandas_ta.*", "lightgbm.*", "pyarrow.*", "kiteconnect.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Required from pytest-asyncio 1.0 — without it every run emits a deprecation
# warning, and when the default eventually changes, session-scoped async
# fixtures would silently start getting a fresh event loop per test.
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
# A test that runs past this dumps every thread's stack instead of hanging in
# silence. Added after a hang inside CPython's Windows socketpair emulation cost
# two wrong diagnoses before a dump named it (tests/sit, E15-S09). It reports; it
# does not kill, so a slow test still finishes.
faulthandler_timeout = 300
markers = [
    "unit: fast, no I/O",
    "property: Hypothesis property-based tests",
    "integration: requires Redis/Postgres containers",
    "replay: historical replay regression",
    "chaos: failure-injection tests",
    "security: security control verification",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["src/algotrader"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# Safety-critical modules must be fully covered — see LOW_LEVEL_ARCHITECTURE.md §12.1.
# Enforced by scripts/coverage_gate.py, which CI runs after the suite (E22-S07). Until
# 21 Nov 2026 a [tool.coverage.paths] entry stood here naming execution/risk_engine.py,
# which does not exist - and [paths] maps source locations when combining data files,
# so it enforced nothing even when it named real files.
