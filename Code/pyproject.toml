[project]
name = "algotrader"
version = "0.1.0"
description = "AI-driven algorithmic trading platform for Indian markets (NSE/BSE) — personal use"
# 3.11 is the floor (verified working); 3.12+ recommended for performance.
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # --- Core ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",

    # --- Async / runtime ---
    "uvloop>=0.20; sys_platform != 'win32'",
    "httpx>=0.27",
    "tenacity>=9.0",

    # --- Data fabric ---
    "redis[hiredis]>=5.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",

    # --- Market analysis ---
    "numpy>=2.1",
    "pandas>=2.2",
    "TA-Lib>=0.4.32",          # requires the C library — see README

    # --- Broker ---
    "kiteconnect>=5.0",        # Zerodha Kite Connect (primary)

    # --- AI ---
    "anthropic>=0.40",

    # --- API / UI ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "webauthn>=2.2",

    # --- Ops ---
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "testcontainers[postgres,redis]>=4.8",
    "ruff>=0.7",
    "mypy>=1.12",
    "pip-audit>=2.7",
    "types-pyyaml",
    "types-python-dateutil",
]
research = [
    "pandas-ta>=0.3.14b",      # BACKTEST/RESEARCH ONLY — never in the live hot path
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algotrader"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "S",         # bandit (security)
    "C4",        # comprehensions
    "DTZ",       # naive-datetime detection — important: all timestamps must be tz-aware
    "RUF",
]
ignore = [
    "S101",      # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["talib.*", "pandas_ta.*", "lightgbm.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "unit: fast, no I/O",
    "property: Hypothesis property-based tests",
    "integration: requires Redis/Postgres containers",
    "replay: historical replay regression",
    "chaos: failure-injection tests",
    "security: security control verification",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["src/algotrader"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# Safety-critical modules must be fully covered — see LOW_LEVEL_ARCHITECTURE.md §12.1
[tool.coverage.paths]
risk = ["src/algotrader/execution/risk_engine.py", "src/algotrader/execution/sizer.py"]
