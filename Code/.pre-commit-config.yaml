# Install once:  pip install pre-commit && pre-commit install
#
# The gitleaks hook is the important one. A leaked broker credential in git
# history is a total-loss event, and history rewrites are painful — so the
# cheapest place to stop it is before the commit exists.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (block committed secrets)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: safety-invariants
        name: safety invariants must hold
        entry: pytest tests/security -q
        language: system
        pass_filenames: false
        types: [python]

      - id: no-env-files
        name: block .env from being committed
        entry: bash -c 'if git diff --cached --name-only | grep -qE "^\.env$|^\.env\..*[^e]$"; then echo "Refusing to commit a .env file"; exit 1; fi'
        language: system
        pass_filenames: false
