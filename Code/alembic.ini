# ===========================================================================
# Alembic configuration.
#
# NOTE: `sqlalchemy.url` below is a PLACEHOLDER and is never used.
# migrations/env.py overwrites it at runtime from config/system.yaml plus the
# POSTGRES_PASSWORD secret (or the DATABASE_URL override).  That keeps the
# credential out of this version-controlled file — there is exactly one place
# the connection is defined, and it is not here.
#
# Usage:
#   make migrate                      -> alembic upgrade head
#   make migration M="add positions"  -> alembic revision --autogenerate
# ===========================================================================

[alembic]
script_location = migrations

# Prepend the source tree so `from algotrader...` resolves when alembic runs
# from the Code/ directory.
prepend_sys_path = src

# Date-prefixed revision filenames so `ls migrations/versions` reads in the
# order the migrations were written, not in hash order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Migration timestamps in UTC, matching the rest of the system.
timezone = UTC

path_separator = os

# Overwritten in env.py — see the note above.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Format and lint every generated migration so autogenerated files match the
# rest of the codebase instead of needing a manual tidy-up pass.
#
# `type = module` runs `python -m ruff` using the SAME interpreter alembic is
# running under.  `type = exec` was tried first and fails on Windows with
# "[WinError 2] The system cannot find the file specified", because it needs
# the bare `ruff` executable on PATH — which it is not unless the venv is
# activated, and `make migration` does not require that.  Going through the
# interpreter removes the PATH dependency entirely.
hooks = ruff_fmt,ruff_fix

ruff_fmt.type = module
ruff_fmt.module = ruff
ruff_fmt.options = format REVISION_SCRIPT_FILENAME

ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME


# --- Logging ---------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
